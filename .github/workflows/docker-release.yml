name: Docker Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: sigstore/cosign-installer@v4

      - name: Sign image (cosign, keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/docker-release\.yml@refs/tags/.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  notify:
    needs: docker
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ needs.docker.result == 'success' && '✅ Образ опубліковано' || '❌ Помилка публікації образу' }}: ${{ github.repository }} ${{ github.event.release.tag_name }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*${{ needs.docker.result == 'success' && '✅ Образ опубліковано' || '❌ Помилка публікації образу' }}*\nРепозиторій: `${{ github.repository }}`\nВерсія: `${{ needs.docker.outputs.version }}`\nОбраз: `${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ needs.docker.outputs.version }}`\n<${{ github.event.release.html_url }}|Реліз> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Запуск воркфлоу>"