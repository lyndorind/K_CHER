name: Image Scan

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to scan
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  grype:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan with Grype
        id: grype
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.IMAGE_REF }}
          fail-build: false
          output-format: sarif

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype


  snyk:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan with Snyk
        id: snyk_scan
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_REF }}
          args: --file=Dockerfile --sarif-file-output=snyk.sarif --severity-threshold=low

      - name: Check generated report
        if: always()
        run: |
          pwd
          ls -la
          if [ -f snyk.sarif ]; then
            echo "SARIF report exists"
          else
            echo "SARIF report was not generated"
            exit 1
          fi

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk
