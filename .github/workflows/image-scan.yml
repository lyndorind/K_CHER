
name: Image Scan

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to scan
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  grype:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan with Grype
        id: grype
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.IMAGE_REF }}
          fail-build: false
          output-format: sarif

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype


  snyk:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Scan with Snyk
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_REF }}
          args: --file=Dockerfile --severity-threshold=low --sarif-file-output=snyk.sarif


      - name: Fix invalid SARIF severity values
        if: always()
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("snyk.sarif")

          if not path.exists():
              raise SystemExit("ERROR: snyk.sarif does not exist")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          removed = []

          def clean(obj, location="$"):
              if isinstance(obj, dict):
                  if (
                      "security-severity" in obj
                      and obj["security-severity"] is None
                  ):
                      removed.append(location + ".security-severity")
                      del obj["security-severity"]

                  for key, value in list(obj.items()):
                      clean(value, f"{location}.{key}")

              elif isinstance(obj, list):
                  for i, value in enumerate(obj):
                      clean(value, f"{location}[{i}]")

          clean(data)

          with path.open("w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f"Removed null severity values: {len(removed)}")
          for item in removed:
              print(f"Fixed: {item}")

          print("SARIF file updated successfully.")
          PY


      - name: Check Snyk SARIF report
        if: always()
        run: |
          test -s snyk.sarif || {
            echo "::error::snyk.sarif is missing or empty"
            exit 1
          }
          python3 -m json.tool snyk.sarif > /dev/null
          echo "SARIF JSON is valid."

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk
