
name: Image Scan

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to scan
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  grype:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan with Grype
        id: grype
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.IMAGE_REF }}
          fail-build: false
          output-format: sarif

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype


  snyk:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Scan with Snyk
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_REF }}
          args: --file=Dockerfile --severity-threshold=low --sarif-file-output=snyk.sarif

      - name: Fix invalid SARIF severity values
        if: always()
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          from numbers import Number

          path = Path("snyk.sarif")

          if not path.exists():
              raise SystemExit("ERROR: snyk.sarif was not created")

          with path.open(encoding="utf-8") as f:
              data = json.load(f)

          removed = 0
          converted = 0

          def fix(obj):
              global removed, converted

              if isinstance(obj, dict):
                  props = obj.get("properties")

                  if isinstance(props, dict):
                      value = props.get("security-severity")

                      if "security-severity" in props:
                          if value is None or isinstance(value, bool):
                              del props["security-severity"]
                              removed += 1
                          elif isinstance(value, str):
                              try:
                                  number = float(value)
                                  if 0 < number <= 10:
                                      props["security-severity"] = str(number)
                                      converted += 1
                                  else:
                                      del props["security-severity"]
                                      removed += 1
                              except ValueError:
                                  del props["security-severity"]
                                  removed += 1
                          elif isinstance(value, Number):
                              if not 0 < value <= 10:
                                  del props["security-severity"]
                                  removed += 1

                  for value in obj.values():
                      fix(value)

              elif isinstance(obj, list):
                  for value in obj:
                      fix(value)

          fix(data)

          with path.open("w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f"Removed invalid severity values: {removed}")
          print(f"Normalized numeric severity values: {converted}")
          print("SARIF file saved.")
          PY

      - name: Check Snyk SARIF report
        if: always()
        run: |
          test -s snyk.sarif || {
            echo "::error::snyk.sarif is missing or empty"
            exit 1
          }
          python3 -m json.tool snyk.sarif > /dev/null
          echo "SARIF JSON is valid."

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk
