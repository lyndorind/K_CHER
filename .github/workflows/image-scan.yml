
name: Image Scan

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to scan
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  grype:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan with Grype
        id: grype
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.IMAGE_REF }}
          fail-build: false
          output-format: sarif

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype


  snyk:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_NAMESPACE }}/kcher:${{ inputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Scan with Snyk
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_REF }}
          args: --file=Dockerfile --severity-threshold=low --sarif-file-output=snyk.sarif



      - name: Fix invalid SARIF severity values
        if: always()
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("snyk.sarif")

          if not path.exists():
              raise SystemExit("ERROR: snyk.sarif does not exist")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          fixed = 0

          def clean(obj):
              nonlocal_dummy = None
              global_fixed = 0

              if isinstance(obj, dict):
                  if "security-severity" in obj and obj["security-severity"] is None:
                      del obj["security-severity"]
                      global_fixed = 1

                  for value in obj.values():
                      clean(value)

              elif isinstance(obj, list):
                  for value in obj:
                      clean(value)

          def remove_nulls(obj):
              global fixed

              if isinstance(obj, dict):
                  if "security-severity" in obj and obj["security-severity"] is None:
                      del obj["security-severity"]
                      fixed += 1

                  for value in list(obj.values()):
                      remove_nulls(value)

              elif isinstance(obj, list):
                  for value in obj:
                      remove_nulls(value)

          remove_nulls(data)

          with path.open("w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f"Removed null severity values: {fixed}")
          PY



      - name: Check Snyk SARIF report
        if: always()
        run: |
          test -s snyk.sarif || {
            echo "::error::snyk.sarif is missing or empty"
            exit 1
          }
          python3 -m json.tool snyk.sarif > /dev/null
          echo "SARIF JSON is valid."

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk
