name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Generate SHA-256
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Upload package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ github.event.pull_request.number }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error