name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Read version from code
        id: version
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' src/k_cher/__init__.py)
          echo "Version: ${VERSION}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v${VERSION} already exists, release skipped. Bump the version to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            /^## \[/ {f=0}
            f
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md || { echo "::error::No CHANGELOG entry for ${VERSION}"; exit 1; }

      - name: Build package
        if: steps.check.outputs.exists == 'false'
        run: uv build

      - name: Generate SHA-256
        if: steps.check.outputs.exists == 'false'
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        uses: ./.github/actions/create-release
        with:
          version: ${{ steps.version.outputs.value }}
          notes-file: release_notes.md
          files: dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt
          token: ${{ secrets.RELEASE_TOKEN }}