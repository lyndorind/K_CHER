name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read version from code
        id: version
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' src/k_cher/__init__.py)
          echo "Version: ${VERSION}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            /^## \[/ {f=0}
            f
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md || { echo "::error::No CHANGELOG entry for ${VERSION}"; exit 1; }

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Generate SHA-256
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Create tag and release
        uses: ./.github/actions/create-release
        with:
          version: ${{ steps.version.outputs.value }}
          notes-file: release_notes.md
          files: dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}