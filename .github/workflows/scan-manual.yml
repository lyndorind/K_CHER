name: Manual Image Scan

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версія образу (тег), наприклад 1.3.0"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    uses: lyndorind/kcher/.github/workflows/image-scan.yml@main
    with:
      tag: ${{ inputs.version }}
    secrets: inherit
