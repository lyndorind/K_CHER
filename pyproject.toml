[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k-cher"
dynamic = ["version"]
description = "Навчальний проєкт для практичної з GitHub Actions"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = {attr = "k_cher.__version__"}

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]